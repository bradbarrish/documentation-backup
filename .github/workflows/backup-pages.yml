name: Back up documentation Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * *'
permissions:
  contents: write
concurrency:
  group: documentation-page-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch public documentation Pages
        run: python3 scripts/backup-pages.py
      - name: Commit updated content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Back up documentation Pages'
          git pull --rebase origin main
          git push origin HEAD:main
